<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>كيرم اونلاين</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  color:white;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100dvh;
  margin:auto;
  padding:clamp(25px,6vh,55px) 22px 25px;
  background:
    radial-gradient(circle at top,rgba(0,110,255,.18),transparent 38%),
    linear-gradient(180deg,#02050c,#001326 55%,#03070d);
  overflow:hidden;
}

@supports(height:100svh){
  .app{
    min-height:100svh;
  }
}

.logo{
  width:100%;
  display:flex;
  justify-content:center;
  margin-bottom:25px;
}

.logo img{
  width:min(88vw,395px);
  max-height:42vh;
  height:auto;
  object-fit:contain;
  filter:drop-shadow(0 0 18px rgba(0,150,255,.55));
}

.card{
  width:100%;
  border:2px solid rgba(0,112,255,.9);
  border-radius:24px;
  padding:clamp(26px,7vw,38px) clamp(18px,6vw,28px);
  background:rgba(0,25,65,.45);
  box-shadow:
    0 0 28px rgba(0,110,255,.45),
    inset 0 0 35px rgba(0,110,255,.16);
}

.card h1{
  text-align:center;
  font-size:clamp(28px,8vw,38px);
  margin-bottom:14px;
}

.card p{
  text-align:center;
  color:#6ea2dc;
  font-size:clamp(16px,4.5vw,21px);
  margin-bottom:28px;
}

.btn{
  width:100%;
  height:clamp(56px,14vw,68px);
  border-radius:17px;
  border:1.5px solid rgba(90,155,255,.9);
  margin-bottom:18px;
  color:white;
  font-size:clamp(18px,5vw,24px);
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.04)),
    linear-gradient(90deg,#1859b9,#001947);
  box-shadow:
    inset 0 4px 10px rgba(255,255,255,.22),
    0 0 18px rgba(0,110,255,.35);
  transition:.15s;
}

.btn:active{
  transform:scale(.96);
}

.google{
  color:#aee4ff;
}

.google-icon{
  font-size:30px;
  font-weight:900;
  color:#4285f4;
}

.apple{
  background:
    linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.05)),
    linear-gradient(90deg,#5d6c7f,#111d30);
}

.apple-icon{
  width:27px;
  height:27px;
  fill:white;
}

.guest{
  color:#70a9e8;
  background:
    linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.03)),
    linear-gradient(90deg,#102f67,#000d2b);
}

.or{
  display:flex;
  align-items:center;
  color:#3c7cc5;
  font-size:23px;
  margin:26px 0;
}

.or::before,
.or::after{
  content:"";
  flex:1;
  height:1px;
  background:rgba(0,111,255,.45);
}

.or span{
  padding:0 18px;
}

.terms{
  text-align:center;
  margin-top:28px;
  color:#5e8fc0;
  font-size:clamp(13px,3.7vw,16px);
  line-height:1.8;
}

.terms a{
  color:#69d7ff;
}

@media(max-height:760px){
  .logo img{
    width:clamp(220px,78vw,330px);
    max-height:36vh;
  }

  .card{
    padding:22px 18px;
  }

  .btn{
    height:54px;
  }
}

@media(max-width:360px){

  .app{
    padding:18px 16px 20px;
  }

  .logo img{
    width:78%;
  }

  .card{
    padding:20px 16px;
  }

  .btn{
    height:50px;
    font-size:17px;
  }

}

</style>
</head>

<body>

<div class="app">

<div class="logo">
<img src="كيرم اونلاين.png" alt="كيرم اونلاين">
</div>

<div class="card">



<p>اختر طريقة الدخول مرة واحدة فقط</p>

<button class="btn google" onclick="loginGoogle()">
الدخول بـ Google
<span class="google-icon">G</span>
</button>
<button class="btn apple" onclick="loginApple()">
الدخول بـ Apple

<svg class="apple-icon" viewBox="0 0 384 512">
<path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82 102.6-118.8-65.2-30.7-61.7-90.4-61.7-92.4zM262.1 104.5c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
</svg>

</button>

<div class="or">
<span>أو</span>
</div>

<button class="btn guest" onclick="guestLogin()">
الدخول كضيف
</button>

</div>

<div class="terms">
بالدخول، أنت توافق على
<a href="#">شروط الاستخدام</a>
و
<a href="#">سياسة الخصوصية</a>
</div>

</div>

<script>

function loginGoogle(){
    completeLogin("google");
}

function loginApple(){
    completeLogin("apple");
}

function guestLogin(){
    completeLogin("guest");
}

function completeLogin(provider){
    localStorage.setItem("carrom_auth_state", "logged-in");
    localStorage.setItem("carrom_login_provider", provider);
    window.location.replace("الرئيسية.html");
}

</script>

</body>
</html>
