<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>كيرم ONLINE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.splash{

    position:relative;

    width:100%;
    max-width:430px;
    height:100dvh;

    overflow:hidden;

    background:#000;

}

.splash img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

}

/* طبقة سوداء خفيفة */

.overlay{

    position:absolute;

    inset:0;

    background:linear-gradient(
    to bottom,
    rgba(0,0,0,.05),
    rgba(0,0,0,.15),
    rgba(0,0,0,.55)
    );

}

/* جاري التحميل */

.loading{

    position:absolute;

    bottom:90px;

    width:100%;

    text-align:center;

    color:white;

    font-size:20px;

    letter-spacing:1px;

    text-shadow:0 0 15px #00aaff;

}

/* شريط التحميل */

.progress{

    position:absolute;

    bottom:45px;

    left:50%;

    transform:translateX(-50%);

    width:82%;

    height:9px;

    border-radius:50px;

    overflow:hidden;

    background:rgba(255,255,255,.15);

    box-shadow:0 0 15px rgba(0,150,255,.5);

}

.progress span{

    display:block;

    height:100%;

    width:0;

    border-radius:50px;

    background:linear-gradient(90deg,#00bfff,#5de0ff);

    animation:loading 3s linear forwards;

}

@keyframes loading{

    from{
        width:0%;
    }

    to{
        width:100%;
    }

}

</style>
</head>

<body>

<div class="splash">

<img src="صوره البدايه.png" alt="Splash">

<div class="overlay"></div>

<div class="loading">
جاري التحميل...
</div>

<div class="progress">
<span></span>
</div>

</div>

<script>
setTimeout(function () {
    window.location.replace("تسجيل الدخول.html");
}, 3000);
</script>

</body>
</html>
